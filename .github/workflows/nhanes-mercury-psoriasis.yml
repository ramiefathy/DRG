name: NHANES mercury psoriasis research

on:
  push:
    branches:
      - research/nhanes-mercury-psoriasis-2026
    paths:
      - 'research/nhanes_mercury_psoriasis/**'
      - '.github/workflows/nhanes-mercury-psoriasis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy statsmodels patsy pyarrow requests openpyxl xlrd matplotlib

      - name: Inspect public NHANES source tables
        run: python research/nhanes_mercury_psoriasis/inspect_nhanes.py

      - name: Inspect published supplementary files
        run: python research/nhanes_mercury_psoriasis/inspect_supplement.py

      - name: Prepare survey-design-enriched analysis data
        run: python research/nhanes_mercury_psoriasis/prepare_enriched.py

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhanes-source-inspection
          path: artifacts
          if-no-files-found: error
          retention-days: 14
