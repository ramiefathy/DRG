name: MEPS dermatology access research

on:
  push:
    branches:
      - research/meps-dermatology-access-2026
    paths:
      - 'research/meps_dermatology_access/**'
      - '.github/workflows/meps-dermatology-access.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyreadstat requests
      - name: Inspect public MEPS files
        run: python research/meps_dermatology_access/inspect_meps.py
      - name: Upload source inspection
        uses: actions/upload-artifact@v4
        with:
          name: meps-dermatology-access-inspection
          path: artifacts/meps_inspection
          if-no-files-found: error
          retention-days: 14
